[project]
name = "cfr-benefits-assistant"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["app"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_eval_set.py" = ["E501"]   # prompt text
"app/answer.py" = ["E501"]   # prompt text
